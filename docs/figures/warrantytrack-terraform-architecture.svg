<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">WarrantyTrack Terraform deployment architecture</title>
  <desc id="desc">Default Terraform configuration: browser through Internet Gateway to public Application Load Balancer, then web and API containers in one ECS Fargate task in public subnets. The API connects to single-AZ RDS PostgreSQL in private subnets. Cognito, ECR, SSM and CloudWatch are configured services. An alternate Learner Lab mode uses a database container instead of RDS.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#2563eb"/></marker>
    <marker id="arrow-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#475569"/></marker>
    <style>
      .title{font:700 37px -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;fill:#10213b}
      .subtitle{font:400 20px -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;fill:#52637b}
      .label{font:700 19px -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;letter-spacing:1px;fill:#34506b}
      .box-title{font:700 23px -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;fill:#14243d}
      .box-body{font:400 18px -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;fill:#4c617a}
      .small{font:500 16px -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;fill:#51637a}
      .tiny{font:500 15px -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;fill:#51637a}
      .flow{fill:none;stroke:#2563eb;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}
      .secondary{fill:none;stroke:#475569;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow-slate)}
      .card{fill:#fff;stroke:#b6c9df;stroke-width:2}
    </style>
  </defs>

  <rect width="1600" height="1000" fill="#f8fafc"/>
  <rect x="36" y="32" width="1528" height="924" rx="28" fill="#fff" stroke="#d8e2ef" stroke-width="2"/>
  <text class="title" x="72" y="90">WarrantyTrack · Terraform deployment architecture</text>
  <text class="subtitle" x="72" y="125">Declared AWS resources · default configuration · not a live deployment status</text>
  <rect x="1284" y="67" width="240" height="44" rx="22" fill="#eaf2ff"/>
  <text x="1404" y="95" text-anchor="middle" style="font:700 17px -apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;fill:#1d4ed8">ap-southeast-1</text>

  <!-- AWS and VPC boundary -->
  <rect x="242" y="158" width="1280" height="646" rx="26" fill="#fbfcff" stroke="#a7b8d0" stroke-width="2.5"/>
  <text class="label" x="272" y="193">AWS REGION</text>
  <rect x="268" y="218" width="1228" height="470" rx="24" fill="#fff" stroke="#7a94b5" stroke-width="2.5"/>
  <text class="label" x="295" y="251">VPC 10.0.0.0/16 · TWO AVAILABILITY ZONES</text>

  <!-- Public subnet group -->
  <rect x="294" y="270" width="797" height="388" rx="21" fill="#eff7ff" stroke="#8cbbe9" stroke-width="2"/>
  <text class="label" x="320" y="306" style="fill:#185c9c">PUBLIC SUBNETS (2)</text>
  <text class="small" x="320" y="331">Internet route · ECS tasks assigned public IPs</text>

  <!-- Private subnet group -->
  <rect x="1113" y="270" width="356" height="388" rx="21" fill="#f5f0ff" stroke="#baa7e8" stroke-width="2"/>
  <text class="label" x="1138" y="306" style="fill:#6845aa">PRIVATE SUBNETS (2)</text>
  <text class="small" x="1138" y="331">Database placement</text>

  <!-- Browser and gateway -->
  <rect class="card" x="68" y="398" width="153" height="138" rx="17"/>
  <circle cx="144" cy="436" r="20" fill="#e8f0fc" stroke="#6f97c9" stroke-width="2"/>
  <path d="M132 437h24M144 425c-8 8-8 16 0 24M144 425c8 8 8 16 0 24M125 436h38" fill="none" stroke="#4f77ac" stroke-width="1.7"/>
  <text class="box-title" x="144" y="484" text-anchor="middle">Users</text>
  <text class="box-body" x="144" y="511" text-anchor="middle">Browser</text>
  <rect x="256" y="432" width="73" height="69" rx="14" fill="#e5effc" stroke="#7ba9db" stroke-width="2"/>
  <text x="292" y="460" text-anchor="middle" style="font:700 17px -apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;fill:#205e9c">IGW</text>
  <text class="tiny" x="292" y="481" text-anchor="middle">internet</text>
  <path class="flow" d="M221 467H255"/>

  <!-- ALB -->
  <rect class="card" x="361" y="384" width="192" height="165" rx="18"/>
  <rect x="382" y="404" width="150" height="32" rx="9" fill="#e2efff"/>
  <text class="small" x="457" y="426" text-anchor="middle" style="fill:#1d5eab;font-weight:700">ENTRY POINT</text>
  <text class="box-title" x="457" y="470" text-anchor="middle">Public ALB</text>
  <text class="box-body" x="457" y="500" text-anchor="middle">HTTP :80</text>
  <text class="small" x="457" y="527" text-anchor="middle">web target group</text>
  <path class="flow" d="M329 467H360"/>

  <!-- ECS task boundary and containers -->
  <rect x="600" y="361" width="449" height="214" rx="20" fill="#fff" stroke="#5a9ad8" stroke-width="2.6"/>
  <rect x="600" y="361" width="449" height="52" rx="19" fill="#ddecfb"/>
  <rect x="600" y="391" width="449" height="22" fill="#ddecfb"/>
  <text class="box-title" x="624" y="395">ECS Fargate service</text>
  <text class="small" x="1018" y="395" text-anchor="end">one task · public IP</text>
  <rect x="626" y="442" width="174" height="93" rx="13" fill="#f5f9ff" stroke="#98bee9" stroke-width="2"/>
  <text class="box-title" x="713" y="480" text-anchor="middle">Web</text>
  <text class="box-body" x="713" y="510" text-anchor="middle">container :3000</text>
  <rect x="848" y="442" width="174" height="93" rx="13" fill="#f5f9ff" stroke="#98bee9" stroke-width="2"/>
  <text class="box-title" x="935" y="480" text-anchor="middle">API</text>
  <text class="box-body" x="935" y="510" text-anchor="middle">container :8000</text>
  <path class="flow" d="M801 488H847"/>
  <text class="tiny" x="825" y="463" text-anchor="middle">/api/*</text>
  <text class="tiny" x="824" y="557" text-anchor="middle">Web forwards to API over 127.0.0.1</text>
  <path class="flow" d="M553 467H625"/>
  <text class="small" x="589" y="448" text-anchor="middle" style="fill:#1d5eab">:3000</text>

  <!-- RDS -->
  <rect x="1153" y="384" width="274" height="165" rx="18" fill="#fff" stroke="#9f89d3" stroke-width="2"/>
  <rect x="1175" y="404" width="230" height="32" rx="9" fill="#eee7ff"/>
  <text class="small" x="1290" y="426" text-anchor="middle" style="fill:#6845aa;font-weight:700">DATA STORE</text>
  <text class="box-title" x="1290" y="470" text-anchor="middle">RDS PostgreSQL</text>
  <text class="box-body" x="1290" y="500" text-anchor="middle">private · encrypted</text>
  <text class="small" x="1290" y="527" text-anchor="middle">single-AZ default</text>
  <path class="flow" d="M1049 467H1152"/>
  <text class="small" x="1101" y="447" text-anchor="middle" style="fill:#1d5eab">:5432</text>

  <!-- Supporting network resources -->
  <rect x="329" y="597" width="235" height="42" rx="11" fill="#fff" stroke="#9fc4e8" stroke-width="1.8"/>
  <text class="small" x="446" y="624" text-anchor="middle">S3 gateway endpoint</text>
  <rect x="783" y="597" width="267" height="42" rx="11" fill="#fff" stroke="#9fc4e8" stroke-width="1.8"/>
  <text class="small" x="916" y="624" text-anchor="middle">One-off DB migration task</text>

  <!-- AWS managed support services -->
  <text class="label" x="270" y="728">OTHER TERRAFORM-MANAGED RESOURCES</text>
  <rect x="270" y="744" width="287" height="42" rx="12" fill="#f0f4fa" stroke="#ccdae9"/>
  <text class="small" x="413" y="771" text-anchor="middle">Cognito user pool + client</text>
  <rect x="571" y="744" width="265" height="42" rx="12" fill="#f0f4fa" stroke="#ccdae9"/>
  <text class="small" x="704" y="771" text-anchor="middle">ECR web + API repositories</text>
  <rect x="850" y="744" width="300" height="42" rx="12" fill="#f0f4fa" stroke="#ccdae9"/>
  <text class="small" x="1000" y="771" text-anchor="middle">SSM database URL + app key</text>
  <rect x="1164" y="744" width="330" height="42" rx="12" fill="#f0f4fa" stroke="#ccdae9"/>
  <text class="small" x="1329" y="771" text-anchor="middle">CloudWatch logs · 14-day retention</text>

  <!-- Footnotes -->
  <rect x="68" y="830" width="715" height="94" rx="17" fill="#f1f7ff" stroke="#a9c9ee" stroke-width="1.5"/>
  <text x="91" y="862" style="font:700 18px -apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;fill:#205e9c">Learner Lab alternative</text>
  <text class="small" x="91" y="887">With use_container_database=true, db + migrate containers</text>
  <text class="small" x="91" y="909">join the ECS task and the RDS instance is omitted.</text>
  <rect x="804" y="830" width="720" height="94" rx="17" fill="#faf7f2" stroke="#dcc9ab" stroke-width="1.5"/>
  <text x="827" y="862" style="font:700 18px -apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;fill:#8a5a1c">Configured separately or future integration</text>
  <text class="small" x="827" y="887">Document S3 bucket, SES sender verification, EventBridge schedule,</text>
  <text class="small" x="827" y="909">and HTTPS certificate are not created by this Terraform stack.</text>
</svg>
