name: CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

# A new push to the same branch cancels the older, now-pointless run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend — lint, types, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  backend:
    name: Backend — migrations and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: warranty
          POSTGRES_PASSWORD: warranty
          POSTGRES_DB: warrantytrack
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U warranty"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://warranty:warranty@localhost:5432/warrantytrack

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - run: pip install -r requirements.txt

      - name: Apply migrations
        run: alembic upgrade head

      # Fails if someone changed a model without writing a migration.
      - name: Check models match migrations
        run: alembic check

      - run: pytest
