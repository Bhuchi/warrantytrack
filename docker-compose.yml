# Local development stack. Run: docker compose up --build
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: warranty
      POSTGRES_PASSWORD: warranty
      POSTGRES_DB: warrantytrack
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: ../infra/docker/backend.Dockerfile
    env_file: ./backend/.env
    ports:
      - "8000:8000"
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
      dockerfile: ../infra/docker/frontend.Dockerfile
    env_file: ./frontend/.env.local
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
